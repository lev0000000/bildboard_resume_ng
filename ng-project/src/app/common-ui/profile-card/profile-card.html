@if (profile()){
<div class="profile-card">
  <div class="avatar-name">
    <img [src]="profile().avatarUrl | imgUrl" alt="avatar" class="profile-card__avatar" />

    <div class="profile-card__name">
      <strong>{{profile().firstName}}</strong>
    </div>
  </div>

  <div class="profile-card__desc">
    {{profile().description}}
  </div>

  <div class="profile-card__tags">
    <div class="skill-tag">Angular</div>
    <div class="skill-tag">Js</div>
    <div class="skill-tag">HTML</div>
    <div class="skill-tag">CSS</div>
  </div>

  <div class="profile-card__action-btns">
    <button class="btn">Подписаться</button>
  </div>
</div>
}@else{
    <div class=""></div>
}
